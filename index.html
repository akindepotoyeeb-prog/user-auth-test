<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Django Cookie Auth Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Auth Section (Register & Login Forms) -->
    <div id="auth-section">
      <!-- Login Form -->
      <div id="login-box">
        <h2>Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required />
          </div>
          <button type="submit">Log In</button>
        </form>
        <button class="btn-secondary" onclick="toggleForm('register')">Need an account? Register</button>
      </div>

      <!-- Register Form -->
      <div id="register-box" class="hidden">
        <h2>Register</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required />
          </div>
          <button type="submit">Register</button>
        </form>
        <button class="btn-secondary" onclick="toggleForm('login')">Already registered? Log In</button>
      </div>
    </div>

    <!-- Profile Section (Authenticated View) -->
    <div id="profile-section" class="hidden">
      <h2>Welcome Back!</h2>
      <div class="user-info">
        <p><strong>Username:</strong> <span id="user-username"></span></p>
        <p><strong>Email:</strong> <span id="user-email"></span></p>
      </div>
      <button class="btn-danger" id="logout-btn">Log Out</button>
    </div>

    <!-- Status Message Display -->
    <div id="msg" class="message"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
